name: Demo GIF

permissions:
  contents: write

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  # Re-render by hand from the Actions tab (no commit, GIF is uploaded as an artifact)
  workflow_dispatch:
  # Preview the GIF on PRs that touch the demo itself (no commit)
  pull_request:
    paths:
      - demo.tape
      - fixtures/**
      - .github/workflows/demo.yml

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # TEMP diagnostic matrix: which of vhs / ffmpeg broke the render?
    strategy:
      fail-fast: false
      matrix:
        vhs: [v0.11.0, v0.12.0]
        ffmpeg: [nightly, apt]
    steps:
      - uses: actions/checkout@v6
        with:
          # Tag pushes render main and commit to it; other runs render the triggering ref
          ref: ${{ github.event_name == 'push' && 'main' || '' }}

      - name: Build staze
        run: |
          cargo build --release --locked
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Install vhs
        uses: charmbracelet/vhs-action@v2
        with:
          version: ${{ matrix.vhs }}

      - name: Use Ubuntu's stable ffmpeg
        if: matrix.ffmpeg == 'apt'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          echo "/usr/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          vhs --version
          ttyd --version
          ffmpeg -version | head -1

      - name: Seed fixture DB
        run: |
          sudo apt-get update && sudo apt-get install -y sqlite3
          mkdir -p "$HOME/.config/staze"
          DEMO_DB="$RUNNER_TEMP/demo.db"
          bash fixtures/seed_demo_db.sh "$DEMO_DB"
          echo "db_path = \"$DEMO_DB\"" > "$HOME/.config/staze/config.toml"

      - name: Render demo.gif
        run: |
          # Start from nothing, so a render that writes no file can't pass as "unchanged"
          rm -f demo.gif
          vhs demo.tape
          ls -la demo.gif || echo "::warning::vhs did not write demo.gif"

      - name: Upload rendered GIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-gif-run-${{ github.run_number }}-${{ matrix.vhs }}-${{ matrix.ffmpeg }}
          path: demo.gif
          if-no-files-found: warn
          retention-days: 14

      - name: Commit demo.gif if changed
        if: github.event_name == 'push'
        run: |
          # Never commit a deleted or empty GIF from a failed render
          if [ ! -s demo.gif ]; then
            echo "::error::No demo.gif was rendered, keeping the committed one"
            exit 1
          fi
          if git diff --quiet -- demo.gif; then
            echo "demo.gif unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add demo.gif
          git commit -m "Regenerate demo.gif for ${{ github.ref_name }}"
          git push origin HEAD:main
